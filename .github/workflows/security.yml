# Secret scanning, which ci.yml cannot do: bandit reads the code as it stands,
# not what the history remembers. A credential that was committed and later
# removed is still leaked, so every reachable commit is searched, not just HEAD.
#
# The scan is a plain grep on purpose — no third-party action, nothing to pin,
# nothing to trust with a token.
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the point is to catch what was deleted from the tip.
          fetch-depth: 0

      - name: Look for credential-shaped strings in every commit
        run: |
          set -uo pipefail
          # Nothing is exempt from the scan, this workflow least of all: a CI
          # file is one of the likelier places for a token to be pasted while
          # someone is debugging a job, and an exempted file stays invisible
          # for the rest of the history. The exemption was never needed — no
          # alternative below can match the line that defines it, because
          # every literal prefix in it runs straight into a "[" that opens a
          # character class, and no class in the set accepts "[". Keep that
          # property when adding a pattern: end the literal part at a "[".
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,}|SECRET_ACCESS_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9/+]{20,}'
          # The revisions arrive on stdin instead of being spliced onto the
          # command line by $(git rev-list --all). That list grows by one SHA
          # per commit and has no upper bound, so a long-lived repository would
          # eventually push the command past the OS argument-length limit and
          # fail the job with an exec error — a scan that cannot run, wearing
          # the costume of a CI bug. xargs splits the revisions into as many
          # invocations as the limit requires, so history size cannot break it.
          #
          # The captured output decides, not the exit status: xargs answers 123
          # whenever any batch matched nothing, which is the ordinary case, so
          # its status cannot tell "clean" apart from "found something".
          hits="$(git rev-list --all | xargs -r git grep -InE -e "$pattern")" || true
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::a credential-shaped string is committed to this repository"
            echo "Rotate the credential first — removing the line does not unpublish it."
            exit 1
          fi
          echo "No credential-shaped strings found in $(git rev-list --all --count) commits."
