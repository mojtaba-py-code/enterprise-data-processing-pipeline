name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -q --cov=pipeline --cov-report=term-missing

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: docker build -t enterprise-data-pipeline:ci .

      - name: Run the example pipeline in the image
        run: docker run --rm enterprise-data-pipeline:ci

      - name: Verify the image does not run as root
        run: |
          user=$(docker run --rm --entrypoint id enterprise-data-pipeline:ci -u)
          test "$user" != "0" || { echo "::error::image runs as root"; exit 1; }
